# Builds a universal Mickey.app and publishes it as a GitHub release on every v* tag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check tag matches app version
        run: |
          version=$(grep CFBundleShortVersionString project.yml | sed -E 's/.*"(.*)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version in project.yml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test --package-path Packages/MickeyKit

      - name: Check localization
        run: python3 -B scripts/l10n.py check

      - name: Check release files
        run: |
          python3 -B -m unittest discover -s scripts/tests -q
          python3 -B scripts/release.py check

      - name: Build
        run: |
          xcodegen generate --quiet
          xcodebuild -project Mickey.xcodeproj -scheme Mickey -configuration Release \
            -destination "generic/platform=macOS" -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build -quiet

      - name: Package
        run: |
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Mickey.app "Mickey-$VERSION.zip"
          shasum -a 256 "Mickey-$VERSION.zip" > "Mickey-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          : > release-notes.md
          # Hand-written notes (docs/releases/<version>.md) when there are some, the changelog section otherwise.
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" >> release-notes.md
          else
            printf "## What's new in %s\n\n" "$VERSION" >> release-notes.md
            python3 -B scripts/release.py notes "$VERSION" >> release-notes.md
          fi
          echo >> release-notes.md
          cat >> release-notes.md <<'EOF'
          ## Install

          **With Homebrew**

          ```bash
          brew install arrows78/mickey/mickey
          ```

          Use the full name above: Homebrew 7 only loads casks from third-party taps you trust. After a plain `brew tap`, run `brew trust --tap arrows78/mickey` first.

          **Manually**

          1. Download `Mickey-*.zip`, unzip it and move **Mickey.app** to `/Applications`.

          **First launch**

          This build is signed ad hoc, not notarised, so macOS blocks the first launch. Either open **System Settings › Privacy & Security** and click **Open Anyway**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Mickey.app
          ```

          Universal binary (Apple Silicon and Intel), macOS 14 or later.
          EOF
          # The heredoc above keeps the step's indentation: strip it.
          sed -i.bak 's/^          //' release-notes.md && rm release-notes.md.bak
          gh release create "$GITHUB_REF_NAME" "Mickey-$VERSION.zip" "Mickey-$VERSION.zip.sha256" \
            --title "Mickey $VERSION" $prerelease --notes-file release-notes.md

      # Needs a fine-grained token with "Contents: read and write" on Arrows78/homebrew-mickey, stored as the
      # HOMEBREW_TAP_TOKEN secret. Without it the release is still published and the tap is left alone.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: the Homebrew tap was not updated."
            exit 0
          fi
          sha=$(cut -d' ' -f1 "Mickey-$VERSION.zip.sha256")
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/Arrows78/homebrew-mickey.git" tap
          mkdir -p tap/Casks
          sh scripts/render_cask.sh "$VERSION" "$sha" > tap/Casks/mickey.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mickey.rb
          git diff --cached --quiet && { echo "Tap already up to date."; exit 0; }
          git commit --quiet -m "mickey $VERSION"
          git push --quiet
